<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navidad · Fondos Dinámicos</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; }
    body { user-select: none; -webkit-user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
    #plano { position: fixed; inset: 0; z-index: 0; will-change: transform; transform: scale(1.06); }
    #plano video, #plano img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { will-change: transform; }

    /* Marcador: arriba a la derecha, lejos de los iconos del escritorio */
    #hud { position: fixed; top: 18px; right: 22px; z-index: 20; display: flex; gap: 8px;
           pointer-events: none; opacity: .8; transition: opacity .6s; }
    #hud[hidden] { display: none; }
    .pieza { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 9px; border-radius: 999px;
             background: rgba(10, 16, 40, .42); color: #fff; font-size: 13px; font-weight: 600;
             backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
             transition: transform .3s; }
    .pieza svg { width: 16px; height: 16px; display: block; }
    .pieza.salto { transform: scale(1.18); }

    #avisos { position: fixed; top: 56px; right: 22px; z-index: 20; display: flex; flex-direction: column;
              align-items: flex-end; gap: 6px; pointer-events: none; }
    .aviso { max-width: 320px; padding: 7px 14px; border-radius: 12px; background: rgba(10, 16, 40, .62);
             color: #fff; font-size: 13px; line-height: 1.35; backdrop-filter: blur(6px);
             box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); opacity: 0; transform: translateY(-6px);
             transition: opacity .4s, transform .4s; }
    .aviso.visible { opacity: 1; transform: none; }
    .aviso b { color: #ffd76a; }

    #tarjeta { position: fixed; z-index: 20; width: 260px; padding: 12px 16px; border-radius: 14px;
               background: rgba(12, 18, 44, .8); color: #fff; font-size: 14px; line-height: 1.4;
               backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 215, 106, .35);
               pointer-events: none; opacity: 0; transform: translateY(8px) scale(.96); transition: opacity .45s, transform .45s; }
    #tarjeta.visible { opacity: 1; transform: none; }
    #tarjeta .dia { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #ffd76a; margin-bottom: 4px; }

    /* Modo editor (index.html?editar=1) */
    #editor { position: fixed; left: 16px; bottom: 16px; z-index: 30; width: 420px; padding: 12px; border-radius: 12px;
              background: rgba(10, 14, 30, .92); color: #fff; font: 12px/1.4 Consolas, monospace; }
    #editor button { font: inherit; margin: 0 4px 6px 0; padding: 4px 8px; border-radius: 6px; border: 1px solid #556; background: #223; color: #fff; cursor: pointer; }
    #editor button.activo { background: #ffd76a; color: #111; }
    #editor textarea { width: 100%; height: 150px; box-sizing: border-box; background: #000; color: #9f9; border: 0; font: 11px Consolas, monospace; }
  </style>
</head>
<body>
  <div id="plano"><img id="imagen" alt=""></div>

  <div id="hud" hidden>
    <span class="pieza" id="hud-copos" title="">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd36a" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M12 2l-2.5 2.5M12 2l2.5 2.5M12 22l-2.5-2.5M12 22l2.5-2.5"/></svg>
      <b>0</b>
    </span>
    <span class="pieza" id="hud-racha">
      <svg viewBox="0 0 24 24"><path d="M12 2l3 5h-2l3.5 5H14l4 6H6l4-6H7.5L11 7H9z" fill="#5be584"/><rect x="10.5" y="18" width="3" height="4" fill="#a0683c"/><circle cx="12" cy="2.6" r="1.6" fill="#ffd36a"/></svg>
      <b>0</b>
    </span>
  </div>
  <div id="avisos"></div>
  <div id="tarjeta"></div>

  <script src="motor.js"></script>
  <script src="arte/arte.js"></script>
  <script src="escena.js"></script>
  <script src="juego.js"></script>
  <script src="fondo.js"></script>
</body>
</html>
