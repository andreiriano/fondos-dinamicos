<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi fondo con efecto · Fondos Dinámicos</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { user-select: none; -webkit-user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
    #medio > video, #medio > img {
      position: fixed; left: 0; top: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0; pointer-events: none;
    }
    #velo { position: fixed; inset: 0; background: #000; opacity: 0; z-index: 0; pointer-events: none; }
    #aviso {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10;
      max-width: 34em; padding: 1.5em 2em; border-radius: 14px;
      background: rgba(20, 24, 40, 0.88); color: #f2f4ff; line-height: 1.5; text-align: center;
      pointer-events: none;
    }
    #aviso b { color: #ffd96b; }
  </style>
</head>
<body>
  <div id="medio"></div>
  <div id="velo"></div>
  <div id="aviso" hidden>
    Falta tu imagen o vídeo.<br>
    Copia en esta carpeta un archivo llamado <b>mi-fondo.mp4</b>, <b>mi-fondo.gif</b> o <b>mi-fondo.jpg</b>
    (también vale .webm, .webp o .png).
  </div>
  <script src="ajustes.js"></script>
  <script src="motor.js"></script>
  <script src="efectos.js"></script>
  <script src="plantilla.js"></script>
</body>
</html>
